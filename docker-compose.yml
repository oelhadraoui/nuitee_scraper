# ===========================================================================
# docker-compose.yml
# ===========================================================================
# Services:
#   scraper        - default full run (both horizons, 3-month window)
#   horizon-3d     - J+3 only          (profile: horizons)
#   horizon-7d     - J+7 only          (profile: horizons)
#   verify         - repair pass       (profile: tools)
#   report         - quality report    (profile: tools)
#   shell          - interactive shell (profile: tools)
#
# Profiles keep `docker compose up` from starting the tool containers.
# ===========================================================================

x-scraper-base: &scraper-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: nuitee-price-scraper:2.0.0

  # Chromium crashes with the default 64 MB /dev/shm.
  shm_size: "2gb"
  ipc: host
  init: true

  env_file:
    - .env
  environment:
    - PYTHONUNBUFFERED=1
    - TZ=${TZ:-Africa/Casablanca}

  volumes:
    - ./output:/app/output
    - ./input.json:/app/input.json:ro
    # National/international split (see README §3) - each needs its own bind
    # mount by name, same as input.json above. Docker only mounts what's
    # declared here; a bare `--input some_other_name.json` on the host is
    # invisible to the container no matter what the file actually contains,
    # which is exactly the "Input file not found" surprise this caused.
    # `make` targets auto-generate these two (see _ensure_input in the
    # Makefile) before they're ever needed, so the source path always
    # exists by the time Compose starts - if you run `docker compose`
    # directly instead of through `make`, generate them yourself first:
    #   python scripts/generate_input.py --preset morocco --output input_morocco.json
    #   python scripts/generate_input.py --preset europe --preset mena --preset world --output input_international.json
    - ./input_morocco.json:/app/input_morocco.json:ro
    - ./input_international.json:/app/input_international.json:ro
    - ./config:/app/config:ro
    - ./src:/app/src:ro

  working_dir: /app
  restart: "no"

  deploy:
    resources:
      limits:
        cpus: "${CPU_LIMIT:-3.0}"
        memory: ${MEM_LIMIT:-6G}
      reservations:
        cpus: "3"
        memory: 6G

  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

services:
  # -- default: both offsets (short + long), both stay durations ----------
  scraper:
    <<: *scraper-base
    container_name: nuitee_scraper
    command: ["run", "--only-offset", "all"]

  # -- short offset only (~1 week out) --------------------------------------
  offset-short:
    <<: *scraper-base
    container_name: nuitee_offset_short
    profiles: ["offsets"]
    command: ["run", "--only-offset", "short", "--run-id", "short"]

  # -- long offset only (~3/2 months out) -------------------------------------
  offset-long:
    <<: *scraper-base
    container_name: nuitee_offset_long
    profiles: ["offsets"]
    command: ["run", "--only-offset", "long", "--run-id", "long"]

  # -- long offset forced to its 2-month fallback --------------------------
  fallback-2m:
    <<: *scraper-base
    container_name: nuitee_fallback_2m
    profiles: ["offsets"]
    command: ["run", "--only-offset", "long"]

  # -- verification / repair pass ------------------------------------------
  verify:
    <<: *scraper-base
    container_name: nuitee_verify
    profiles: ["tools"]
    command: ["verify", "--mode", "all", "--export"]

  # -- quality report -------------------------------------------------------
  report:
    <<: *scraper-base
    container_name: nuitee_report
    profiles: ["tools"]
    command: ["report"]

  # -- pre-flight check -----------------------------------------------------
  doctor:
    <<: *scraper-base
    container_name: nuitee_doctor
    profiles: ["tools"]
    command: ["doctor"]

  # -- interactive shell ----------------------------------------------------
  shell:
    <<: *scraper-base
    container_name: nuitee_shell
    profiles: ["tools"]
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
