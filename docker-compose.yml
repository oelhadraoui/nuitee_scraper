# ===========================================================================
# docker-compose.yml
# ===========================================================================
# Services:
#   scraper        - default full run (both horizons, 3-month window)
#   horizon-3d     - J+3 only          (profile: horizons)
#   horizon-7d     - J+7 only          (profile: horizons)
#   verify         - repair pass       (profile: tools)
#   report         - quality report    (profile: tools)
#   shell          - interactive shell (profile: tools)
#
# Profiles keep `docker compose up` from starting the tool containers.
# ===========================================================================

x-scraper-base: &scraper-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: nuitee-price-scraper:2.0.0

  # Chromium crashes with the default 64 MB /dev/shm.
  shm_size: "2gb"
  ipc: host
  init: true

  env_file:
    - .env
  environment:
    - PYTHONUNBUFFERED=1
    - TZ=${TZ:-Africa/Casablanca}

  volumes:
    - ./output:/app/output
    - ./input.json:/app/input.json:ro
    # National/international split (see README §3) - each needs its own bind
    # mount by name, same as input.json above. Docker only mounts what's
    # declared here; a bare `--input some_other_name.json` on the host is
    # invisible to the container no matter what the file actually contains,
    # which is exactly the "Input file not found" surprise this caused.
    # `make` targets auto-generate these two (see _ensure_input in the
    # Makefile) before they're ever needed, so the source path always
    # exists by the time Compose starts - if you run `docker compose`
    # directly instead of through `make`, generate them yourself first:
    #   python scripts/generate_input.py --preset morocco --output input_morocco.json
    #   python scripts/generate_input.py --preset priority --preset europe --preset mena --preset world --output input_international.json
    - ./input_morocco.json:/app/input_morocco.json:ro
    - ./input_international.json:/app/input_international.json:ro
    - ./config:/app/config:ro
    - ./src:/app/src:ro

  working_dir: /app
  restart: "no"

  deploy:
    resources:
      limits:
        cpus: "${CPU_LIMIT:-2.0}"
        memory: ${MEM_LIMIT:-6G}
      reservations:
        cpus: "3"
        memory: 6G

  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

# -- background scope workers (national / international) ---------------------
# Each worker writes to its OWN store under output/<scope>/ (prices.csv,
# prices_clean.csv, scraper.log, quality_report.json). Two processes can
# never share one prices.csv: each flush rewrites the whole file from that
# process's memory, so a shared file would lose the other worker's rows.
# `make merge` folds both stores into output/prices.csv afterwards (or at
# any point mid-run, for partial results).
#
# Sized for running BOTH at once on a small host (2 vCPU / ~6 GB free):
# lower per-worker concurrency and memory than the single-run default.
# Override per run, e.g.  WORKER_BOOKING_CONCURRENCY=5 make run-both
x-scope-worker: &scope-worker
  <<: *scraper-base
  profiles: ["scopes"]
  deploy:
    resources:
      limits:
        cpus: "${WORKER_CPU_LIMIT:-2.0}"
        memory: ${WORKER_MEM_LIMIT:-4G}
      reservations:
        memory: 1G
  # Unhealthy = the run's own log hasn't moved in 30 min, i.e. it is stuck.
  # (The old `doctor` healthcheck stayed "healthy" through a 5-day hang.)
  healthcheck:
    test: ["CMD-SHELL", "find \"$$STORAGE_OUTPUT_DIR/scraper.log\" -mmin -30 | grep -q ."]
    interval: 120s
    timeout: 10s
    start_period: 10m
    retries: 2

services:
  # -- national: Moroccan cities -> output/national/ -------------------------
  national:
    <<: *scope-worker
    container_name: nuitee_national
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Africa/Casablanca}
      - STORAGE_OUTPUT_DIR=/app/output/national
      - BOOKING_CONCURRENCY=${WORKER_BOOKING_CONCURRENCY:-4}
      - NUITEE_TUNNEL_CONCURRENCY=${WORKER_TUNNEL_CONCURRENCY:-3}
    command: ["run", "--input", "input_morocco.json", "--only-offset", "${OFFSET:-all}",
              "--run-id", "national"]

  # -- international: priority corridors first, then the rest -> output/international/
  international:
    <<: *scope-worker
    container_name: nuitee_international
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Africa/Casablanca}
      - STORAGE_OUTPUT_DIR=/app/output/international
      - BOOKING_CONCURRENCY=${WORKER_BOOKING_CONCURRENCY:-4}
      - NUITEE_TUNNEL_CONCURRENCY=${WORKER_TUNNEL_CONCURRENCY:-3}
    command: ["run", "--input", "input_international.json", "--only-offset", "${OFFSET:-all}",
              "--run-id", "international"]

  # -- default: both offsets (short + long), both stay durations ----------
  scraper:
    <<: *scraper-base
    container_name: nuitee_scraper
    command: ["run", "--only-offset", "all"]

  # -- short offset only (~1 week out) --------------------------------------
  offset-short:
    <<: *scraper-base
    container_name: nuitee_offset_short
    profiles: ["offsets"]
    command: ["run", "--only-offset", "short", "--run-id", "short"]

  # -- long offset only (~3/2 months out) -------------------------------------
  offset-long:
    <<: *scraper-base
    container_name: nuitee_offset_long
    profiles: ["offsets"]
    command: ["run", "--only-offset", "long", "--run-id", "long"]

  # -- long offset forced to its 2-month fallback --------------------------
  fallback-2m:
    <<: *scraper-base
    container_name: nuitee_fallback_2m
    profiles: ["offsets"]
    command: ["run", "--only-offset", "long"]

  # -- verification / repair pass ------------------------------------------
  verify:
    <<: *scraper-base
    container_name: nuitee_verify
    profiles: ["tools"]
    command: ["verify", "--mode", "all", "--export"]

  # -- quality report -------------------------------------------------------
  report:
    <<: *scraper-base
    container_name: nuitee_report
    profiles: ["tools"]
    command: ["report"]

  # -- pre-flight check -----------------------------------------------------
  doctor:
    <<: *scraper-base
    container_name: nuitee_doctor
    profiles: ["tools"]
    command: ["doctor"]

  # -- interactive shell ----------------------------------------------------
  shell:
    <<: *scraper-base
    container_name: nuitee_shell
    profiles: ["tools"]
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
